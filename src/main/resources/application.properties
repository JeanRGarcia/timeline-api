spring.application.name=timeline-api

# Database connection (defaults match docker-compose.yml; override with env vars in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timeline}
spring.datasource.username=${DB_USERNAME:timeline}
spring.datasource.password=${DB_PASSWORD:timeline}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false